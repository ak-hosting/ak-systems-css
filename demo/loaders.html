<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AK Design System - Loader Demo</title>
    <!-- Link to local CSS for testing -->
    <link rel="stylesheet" href="../css/ak-design-system/index.css">
    <style>
        body {
            background-color: var(--ak-color-bg);
            color: var(--ak-color-text);
            padding: 40px;
        }
        .demo-section {
            margin-bottom: 40px;
            padding: 20px;
            border: 1px solid var(--ak-color-border);
            border-radius: var(--ak-radius-lg);
            background-color: var(--ak-color-surface);
        }
        .demo-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        h2 { margin-top: 0; }
        .label { min-width: 100px; font-weight: bold; }
    </style>
</head>
<body class="ak-theme-light">

    <h1>Loader Framework Demo</h1>

    <!-- SPINNERS -->
    <div class="demo-section">
        <h2>Spinners</h2>
        
        <div class="demo-row">
            <span class="label">Sizes</span>
            <span class="ak-loader-spinner ak-loader-xs ak-loader-primary"></span>
            <span class="ak-loader-spinner ak-loader-sm ak-loader-primary"></span>
            <span class="ak-loader-spinner ak-loader-md ak-loader-primary"></span>
            <span class="ak-loader-spinner ak-loader-lg ak-loader-primary"></span>
            <span class="ak-loader-spinner ak-loader-xl ak-loader-primary"></span>
        </div>

        <div class="demo-row">
            <span class="label">Colors</span>
            <span class="ak-loader-spinner ak-loader-md ak-loader-primary"></span>
            <span class="ak-loader-spinner ak-loader-md ak-loader-secondary"></span>
            <span class="ak-loader-spinner ak-loader-md ak-loader-success"></span>
            <span class="ak-loader-spinner ak-loader-md ak-loader-destructive"></span>
            <span class="ak-loader-spinner ak-loader-md ak-loader-muted"></span>
        </div>
        
        <div class="demo-row" style="background: #333; padding: 10px; border-radius: 8px;">
            <span class="label" style="color: white">White</span>
            <span class="ak-loader-spinner ak-loader-md ak-loader-white"></span>
        </div>
    </div>

    <!-- DOTS -->
    <div class="demo-section">
        <h2>Dots</h2>
        
        <div class="demo-row">
            <span class="label">Sizes</span>
            <div class="ak-loader-dots ak-loader-xs ak-loader-primary"><span></span><span></span><span></span></div>
            <div class="ak-loader-dots ak-loader-sm ak-loader-primary"><span></span><span></span><span></span></div>
            <div class="ak-loader-dots ak-loader-md ak-loader-primary"><span></span><span></span><span></span></div>
            <div class="ak-loader-dots ak-loader-lg ak-loader-primary"><span></span><span></span><span></span></div>
            <div class="ak-loader-dots ak-loader-xl ak-loader-primary"><span></span><span></span><span></span></div>
        </div>

        <div class="demo-row">
            <span class="label">Colors</span>
            <div class="ak-loader-dots ak-loader-md ak-loader-secondary"><span></span><span></span><span></span></div>
            <div class="ak-loader-dots ak-loader-md ak-loader-success"><span></span><span></span><span></span></div>
        </div>
    </div>

    <!-- BARS -->
    <div class="demo-section">
        <h2>Progress Bars</h2>
        
        <h3>Determinate (50%)</h3>
        <div class="ak-loader-bar ak-loader-md ak-loader-primary" style="margin-bottom: 20px;">
            <div class="ak-loader-bar-value" style="width: 50%;"></div>
        </div>

        <h3>Indeterminate</h3>
        <div class="ak-loader-bar ak-loader-indeterminate ak-loader-md ak-loader-primary">
            <div class="ak-loader-bar-value"></div>
        </div>
        
        <h3>Sizes</h3>
        <div class="ak-loader-bar ak-loader-xs ak-loader-primary" style="margin-bottom: 10px;">
            <div class="ak-loader-bar-value" style="width: 75%;"></div>
        </div>
        <div class="ak-loader-bar ak-loader-sm ak-loader-primary" style="margin-bottom: 10px;">
            <div class="ak-loader-bar-value" style="width: 75%;"></div>
        </div>
        <div class="ak-loader-bar ak-loader-lg ak-loader-primary" style="margin-bottom: 10px;">
            <div class="ak-loader-bar-value" style="width: 75%;"></div>
        </div>
    </div>

    <!-- Buttons -->
    <div class="demo-section">
        <h2>In Buttons</h2>
        <div class="demo-row">
            <button class="ak-btn ak-btn-primary">
                <span class="ak-loader-spinner ak-loader-sm ak-loader-white"></span>
                Loading...
            </button>
            
            <button class="ak-btn ak-btn-ghost">
                <span class="ak-loader-spinner ak-loader-sm ak-loader-primary"></span>
            </button>
        </div>
    </div>

</body>
</html>
